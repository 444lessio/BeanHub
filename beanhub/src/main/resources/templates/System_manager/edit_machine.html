<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Machine</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .card { border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Edit Distributor <span th:text="${machine.id}" class="fw-bold">ID</span></h4>
                    </div>
                    
                    <div class="card-body p-4">
                        
                        <form th:action="@{/System_manager/machines/update}" th:object="${machine}" method="post">
                    
                            <input type="hidden" th:field="*{id}" />
                            <input type="hidden" th:field="*{coffeeLevel}" />
                            <input type="hidden" th:field="*{milkLevel}" />
                            <input type="hidden" th:field="*{sugarLevel}" />
                            <input type="hidden" th:field="*{cupsLevel}" />

                            <div class="mb-3">
                                <label class="form-label fw-bold">Location</label>
                                <input type="text" th:field="*{location}" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Status</label>
                                <select th:field="*{status}" class="form-select">
                                    <option value="ACTIVE">Active</option>
                                    <option value="MAINTENANCE">Maintenance</option>
                                    <option value="BROKEN">Broken</option>
                                </select>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Latitude</label>
                                    <input type="number" step="any" th:field="*{latitude}" class="form-control" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Longitude</label>
                                    <input type="number" step="any" th:field="*{longitude}" class="form-control" />
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a th:href="@{/System_manager/machines}" class="btn btn-secondary me-md-2">Cancel</a>
                                <button type="submit" class="btn btn-primary">Update Machine</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
        
    </div>

</body>
</html>
