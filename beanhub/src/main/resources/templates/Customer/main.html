<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{customer.main.title}">Customer Area</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="customer-dashboard">

    <div class="language-switcher">
        <th:block th:with="currentLang=${#locale.language}">
            <button onclick="toggleLangDropdown()" class="dropdown-toggle">
                <img src="https://flagcdn.com/16x12/it.png" alt="IT Flag" th:if="${currentLang == 'it'}">
                <img src="https://flagcdn.com/16x12/gb.png" alt="GB Flag" th:unless="${currentLang == 'it'}">
                <span th:if="${currentLang == 'it'}" th:text="#{lang.it}">IT</span>
                <span th:unless="${currentLang == 'it'}" th:text="#{lang.en}">EN</span>
                <span style="font-size: 0.8em; margin-left: 5px;">▼</span>
            </button>
            <div id="lang-dropdown" class="dropdown-content">
                <a th:href="@{?lang=en}">
                    <img src="https://flagcdn.com/16x12/gb.png" alt="GB Flag">
                    <span th:text="#{lang.en}">EN</span>
                </a>
                <a th:href="@{?lang=it}">
                    <img src="https://flagcdn.com/16x12/it.png" alt="IT Flag">
                    <span th:text="#{lang.it}">IT</span>
                </a>
            </div>
        </th:block>
    </div>

    <div style="width: 100%; max-width: 600px;">
        
        <h1>Hi, <span th:text="${username}">User</span>! 👋</h1>

        <div th:if="${param.error != null}" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #f5c6cb; text-align: center;">
            <span th:if="${param.error[0] == 'low_credit'}">
                <b>insufficient credit!</b> Please top up your account.
            </span>
            <span th:if="${param.error[0] == 'out_of_stock'}">
                <b>Product out of stock!</b> The distributor has run out of ingredients.
            </span>
        </div>

        <div class="credit-card">
            <h3>Your Credit</h3>
            <p class="amount" th:text="${#numbers.formatDecimal(credit, 1, 2)} + ' €'">0.00 €</p>
        </div>

        <div class="actions">
            <a th:href="@{/customer/logout}" class="btn-logout">Log Out</a>
        </div>


        <div class="card">
            <h3>Connect to a distributor</h3>
    
            <div th:if="${isConnected}" style="color: green; font-weight: bold; margin-bottom: 10px;">
                <span th:text="${connectedMsg}"></span>
            </div>

            <form th:action="@{/customer/connect}" method="post" th:if="${!isConnected}">
                <label>Distributor ID</label>
                <input type="text" name="distributorId" placeholder="e.g. D-123" required>
                <button type="submit" class="btn-blue">Connect</button>
            </form>

            <form th:action="@{/customer/disconnect}" method="post" th:if="${isConnected}">
                <button type="submit" class="btn-grey">Disconnect</button>
            </form>
        </div>

        <div class="card">
            <h3>Top up your credit</h3>
            <form th:action="@{/customer/topup}" method="post">
                <label>Amount (€)</label>
                <input type="number" name="amount" step="0.50" min="0.50" placeholder="10.00" required>
                <button type="submit" class="btn-blue">Pay and Top Up</button>
            </form>
        </div>

    </div>


    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/customer.js}"></script> 

</body>
</html>
